apiVersion: v1
kind: Namespace
metadata: { name: cert-manager }
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: { name: jetstack, namespace: cert-manager }
spec: { interval: 12h, url: https://charts.jetstack.io }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: cert-manager, namespace: cert-manager }
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "1.x"
      sourceRef: { kind: HelmRepository, name: jetstack }
  values:
    crds: { enabled: true }
    resources: { requests: { cpu: 10m, memory: 64Mi } }
    webhook: { resources: { requests: { cpu: 10m, memory: 32Mi } } }
    cainjector: { resources: { requests: { cpu: 10m, memory: 32Mi } } }
