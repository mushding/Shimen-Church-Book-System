apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: apps-staging, namespace: flux-system }
spec:
  interval: 5m
  path: ./infra/apps/staging
  prune: true
  wait: true
  timeout: 5m
  dependsOn: [{ name: controllers }]
  sourceRef: { kind: GitRepository, name: flux-system }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: apps-prod, namespace: flux-system }
spec:
  interval: 5m
  path: ./infra/apps/prod
  prune: true
  wait: true
  timeout: 5m
  dependsOn: [{ name: controllers }]
  sourceRef: { kind: GitRepository, name: flux-system }
