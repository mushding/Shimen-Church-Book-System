# Flux: cluster-wide controllers (cert-manager + issuer). Reconciled from this repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: controllers, namespace: flux-system }
spec:
  interval: 10m
  path: ./infra/controllers
  prune: true
  wait: true
  timeout: 5m
  sourceRef: { kind: GitRepository, name: flux-system }
