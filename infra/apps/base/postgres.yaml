# Postgres in-cluster on local-path PV (k3s default StorageClass). Backups: backup.yaml → GCS.
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: smsk }
            - { name: POSTGRES_USER, value: smsk }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: smsk-postgres, key: password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          readinessProbe: { exec: { command: [pg_isready, -U, smsk] }, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
