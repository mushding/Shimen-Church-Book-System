# Traefik (bundled with k3s) + cert-manager. Host set per overlay.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: redirect-https }
spec: { redirectScheme: { scheme: https, permanent: true } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: NAMESPACE-redirect-https@kubernetescrd # overlays patch NAMESPACE
spec:
  ingressClassName: traefik
  tls: [{ hosts: [HOST], secretName: app-tls }]
  rules:
    - host: HOST
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: app, port: { number: 80 } } } }] }
