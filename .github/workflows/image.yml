# Build image → GHCR, then bump the kustomize overlay tag so Flux rolls it out.
#   push to main   → ghcr.io/…:sha-<7>  → infra/apps/staging
#   tag  v*        → ghcr.io/…:v1.2.3   → infra/apps/prod
name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["infra/**", "docs/**", "**.md"]
permissions:
  contents: write
  packages: write
concurrency: image-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT; echo "overlay=prod" >> $GITHUB_OUTPUT;
          else echo "tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT; echo "overlay=staging" >> $GITHUB_OUTPUT; fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shimen-church-book-system:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test image (pglite, no DB needed)
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/shimen-church-book-system:${{ steps.tag.outputs.tag }}
          docker run -d --name smoke -p 3000:3000 -e BETTER_AUTH_SECRET=ci-smoke-secret-32-chars-minimum!! -e BETTER_AUTH_URL=http://localhost:3000 -e PGLITE_DIR=memory:// $IMG
          for i in $(seq 1 30); do curl -sf localhost:3000/healthz && break; sleep 2; done
          curl -sf localhost:3000/healthz
          curl -sf localhost:3000/ | grep -q '<div id="root">'
          curl -sf localhost:3000/api/rooms | grep -q 正堂
          docker logs smoke | tail -5; docker rm -f smoke
      - name: bump ${{ steps.tag.outputs.overlay }} overlay
        run: |
          git fetch origin main && git checkout main
          cd infra/apps/${{ steps.tag.outputs.overlay }}
          sed -i "s/newTag: .*/newTag: ${{ steps.tag.outputs.tag }}/" kustomization.yaml
          git config user.name github-actions && git config user.email github-actions@github.com
          git commit -am "deploy(${{ steps.tag.outputs.overlay }}): ${{ steps.tag.outputs.tag }} [skip ci]" || exit 0
          git push origin main
